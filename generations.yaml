generations:
  - name: "First Generation"
    start_year: 2005
    end_year: 2009
    description: "The Renault Clio III represented a significant step up in size, quality, and refinement compared to its predecessors. Designed under Patrick Le Quément's direction, the third-generation Clio adopted a more mature and substantial appearance with a focus on improved perceived quality. Unveiled at the 2005 Frankfurt Motor Show, the Clio III was built on the Nissan B platform shared with the Nissan Micra and Renault Modus. Available in both three and five-door hatchback body styles, its dimensions increased significantly, pushing it toward the upper end of the supermini segment and approaching the size of some small family cars. Engine options included gasoline units ranging from 1.2 to 2.0 liters and diesel engines, primarily the efficient 1.5 dCi in various power outputs between 65 and 106 horsepower. The performance-oriented Clio Renault Sport featured a naturally aspirated 2.0-liter engine producing 197 horsepower, receiving widespread acclaim for its handling dynamics and performance. Interior quality was substantially improved with better materials and construction, while safety features were enhanced, earning the car a 5-star Euro NCAP safety rating—one of the first superminis to achieve this score. Sales began throughout Europe in October 2005, and it was voted European Car of the Year 2006, becoming the first car to win this award twice."

  - name: "First Generation (2009 Facelift)"
    start_year: 2009
    end_year: 2014
    description: "A facelifted version of the Clio III went on sale in the United Kingdom on 15 May 2009, featuring higher quality interior materials, more equipment, and Patrick Le Quément's third and final interpretation of the Renault family face. This more expressive look signaled a move away from individual model styling, towards a unified, familial approach. New for 2009 was the Clio GT variant, a 'warm hatch' intended to slot between the regular Clio and the Clio 197 R.S., featuring a new aggressive front bumper, black grille, extended side sills, stiffer suspension, twin-tailpipe design, and sporty lip spoiler. The Renault Clio Gordini 200 limited edition was introduced in the UK in 2010, equipped with a 2.0L F4R engine. Following the launch of the Clio IV in 2012, the Clio III range was scaled back but remained on sale alongside its successor in France and Spain as the 'Clio Collection,' positioned as a value-centric alternative to the new Clio IV. Production of the Clio Collection lasted until 2014, marking the complete cessation of Clio III production."
